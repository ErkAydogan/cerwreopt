<!doctype html>
<!-- Tek sayfalık arayüz: framework yok. /schedule ve /jobs uçlarını 2 saniyede bir okur,
     ekip başına Gantt çizer, değişen görevleri vurgular, son işin çözücü çıktısını gösterir. -->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crewreopt – ekip yeniden atama</title>
<style>
  :root { --ink:#1b2430; --muted:#6b7785; --line:#dde3ea; --bg:#f6f8fa; --card:#fff;
          --leg:#3b6fb6; --changed:#d9480f; --cancelled:#aab3be; --ok:#2b8a3e; --bad:#c92a2a; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; color:var(--ink); background:var(--bg); }
  header { padding:14px 24px; background:var(--card); border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; }
  h1 { font-size:18px; margin:0; } h2 { font-size:14px; margin:0 0 10px; }
  main { padding:20px 24px; display:grid; grid-template-columns: 1fr 380px; gap:20px; align-items:start; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:20px; }
  .muted { color:var(--muted); } .mono { font-family: ui-monospace, Menlo, monospace; font-size:12px; }

  /* Gantt: her satır bir ekip; çubuklar yüzde ile konumlanır */
  .row { display:grid; grid-template-columns:56px 1fr; align-items:center; height:38px; border-top:1px solid var(--line); }
  .row.standby .name { color:var(--muted); font-style:italic; }
  .track { position:relative; height:26px; }
  .leg { position:absolute; top:0; height:26px; border-radius:4px; background:var(--leg); color:#fff;
         font-size:11px; padding:5px 6px; overflow:hidden; white-space:nowrap; }
  .leg.changed { background:var(--changed); }
  .leg.cancelled { background:repeating-linear-gradient(45deg, var(--cancelled) 0 6px, #c9d0d8 6px 12px); text-decoration:line-through; }
  .leg.locked { box-shadow: inset 0 -4px 0 rgba(0,0,0,.35); }
  .ghost { position:absolute; top:0; height:26px; border:1.5px dashed var(--muted); border-radius:4px; } /* gecikmeden önceki yer */
  .axis { display:grid; grid-template-columns:56px 1fr; height:20px; }
  .axis .track span { position:absolute; font-size:11px; color:var(--muted); transform:translateX(-50%); }
  .legend span { display:inline-block; margin-right:14px; font-size:12px; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-2px; margin-right:4px; }

  textarea, input { width:100%; font-family: ui-monospace, Menlo, monospace; font-size:12px; padding:8px; border:1px solid var(--line); border-radius:6px; }
  textarea { height:92px; resize:vertical; }
  button { padding:7px 12px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; margin:8px 6px 0 0; }
  button.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; color:#fff; background:var(--muted); }
  .badge.succeeded { background:var(--ok); } .badge.failed, .badge.timed_out { background:var(--bad); } .badge.running { background:var(--leg); }
  table { border-collapse:collapse; width:100%; } td { padding:3px 0; vertical-align:top; } td:first-child { color:var(--muted); width:42%; }
  .change { border-left:3px solid var(--changed); padding:4px 8px; margin:8px 0; background:#fff4ec; }
  #response { margin-top:8px; white-space:pre-wrap; }
  #qr { width:96px; height:96px; background:#fff; border:1px solid var(--line); border-radius:6px; }
  /* Telefonda: tek sütun, mesaj kutusu üstte, çizelge yatay kaydırılır */
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; padding:12px; } aside { order:-1; }
    header { flex-wrap:wrap; padding:10px 12px; } #qr { display:none; }
    #gantt, .axis { min-width:640px; } .card { overflow-x:auto; }
  }
</style>
</head>
<body>
<header>
  <h1>crewreopt</h1>
  <span class="muted">AFTN mesajıyla tetiklenen ekip yeniden atama · <span id="date"></span> · saatler UTC</span>
  <span class="muted mono" id="health" style="margin-left:auto"></span>
  <!-- PUBLIC_URL ayarlıysa: bu sayfanın QR kodu. Ayarlı değilse resim yüklenmez ve gizlenir. -->
  <img id="qr" src="/qr.svg" alt="Demoyu telefonda aç" title="Demoyu telefonda aç" onerror="this.remove()">
</header>
<main>
  <section>
    <div class="card">
      <h2>Ekip çizelgesi</h2>
      <div class="axis"><div></div><div class="track" id="axis"></div></div>
      <div id="gantt"></div>
      <p class="legend">
        <span><i style="background:var(--leg)"></i>planlandığı gibi</span>
        <span><i style="background:var(--changed)"></i>ekibi değişti</span>
        <span><i style="background:var(--cancelled)"></i>iptal</span>
        <span><i style="border:1.5px dashed var(--muted)"></i>gecikmeden önceki saat</span>
        <span><i style="background:var(--leg); box-shadow:inset 0 -4px 0 rgba(0,0,0,.35)"></i>kalktı (kilitli)</span>
      </p>
    </div>
    <div class="card">
      <h2>Son iş</h2>
      <div id="job" class="muted">Henüz iş yok. Sağdan bir mesaj gönderin.</div>
    </div>
  </section>

  <aside>
    <div class="card">
      <h2>AFTN mesajı gönder</h2>
      <textarea id="message">FF LTFMZPZX
231200 EDDFZQZX
(DLA-THY1591-LTFM0830-EDDF-DOF/261123)</textarea>
      <input id="apikey" placeholder="X-API-Key" value="demo-key" style="margin-top:8px">
      <button class="primary" onclick="sendMessage()">Gönder</button>
      <button onclick="fill(DEMO_DLA)">Örnek DLA</button>
      <button onclick="fill(DEMO_CNL)">Örnek CNL</button>
      <button onclick="resetData()">Veriyi sıfırla</button>
      <div id="response" class="mono muted"></div>
    </div>
    <div class="card">
      <h2>İş geçmişi</h2>
      <div id="history" class="muted">–</div>
    </div>
  </aside>
</main>

<script>
const DEMO_DLA = "FF LTFMZPZX\n231200 EDDFZQZX\n(DLA-THY1591-LTFM0830-EDDF-DOF/261123)";
const DEMO_CNL = "FF LTFMZPZX\n231210 LTAIZPZX\n(CNL-THY2412-LTFM1500-LTAI-DOF/261123)";
const DAY_START = 4 * 60, DAY_END = 22 * 60;            // çizelgede gösterilen aralık (dakika)
const $ = id => document.getElementById(id);
const pct = min => (min - DAY_START) / (DAY_END - DAY_START) * 100;
const hhmm = min => String(Math.floor(min / 60)).padStart(2, "0") + ":" + String(min % 60).padStart(2, "0");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function fill(text) { $("message").value = text; }

async function post(path, body) {
  const r = await fetch(path, { method: "POST", body, headers: { "X-API-Key": $("apikey").value } });
  $("response").textContent = r.status + " " + JSON.stringify(await r.json(), null, 1);
  refresh();
}
const sendMessage = () => post("/messages", $("message").value);
const resetData = () => post("/admin/reset", "");

function drawAxis() {
  let html = "";
  for (let m = DAY_START; m <= DAY_END; m += 120) html += `<span style="left:${pct(m)}%">${hhmm(m)}</span>`;
  $("axis").innerHTML = html;
}

function drawGantt(schedule) {
  $("date").textContent = schedule.date;
  $("gantt").innerHTML = schedule.crews.map(crew => {
    const bars = schedule.pairings.filter(p => p.crew === crew.id).map(p => p.legs.map(leg => {
      const cancelled = leg.status === "CANCELLED";
      const cls = cancelled ? "cancelled" : p.changed_by_job ? "changed" : "";
      const locked = ["DEPARTED", "ARRIVED"].includes(leg.status) ? " locked" : "";
      const shift = leg.std_min - leg.orig_std_min;       // gecikme (dk)
      const width = pct(leg.sta_min) - pct(leg.std_min);
      const title = `${p.id} ${leg.callsign} ${leg.adep}→${leg.ades} ${hhmm(leg.std_min)}–${hhmm(leg.sta_min)} ${leg.status}`
        + (p.previous_crew ? ` | ${p.previous_crew} → ${p.crew}` : "") + (shift ? ` | +${shift} dk` : "");
      const ghost = shift ? `<div class="ghost" style="left:${pct(leg.orig_std_min)}%;width:${width}%"></div>` : "";
      return ghost + `<div class="leg ${cls}${locked}" title="${esc(title)}" style="left:${pct(leg.std_min)}%;width:${width}%">`
        + `${leg.callsign.replace("THY", "")} ${leg.ades}</div>`;
    }).join("")).join("");
    return `<div class="row ${crew.is_standby ? "standby" : ""}"><div class="name">${crew.id}</div><div class="track">${bars}</div></div>`;
  }).join("");
}

// Çözücü izi: amaç (turuncu) ve en iyi sınır (gri) zamanla nasıl yaklaştı? Aralarındaki fark gap'tir.
function traceChart(trace) {
  if (!trace || !trace.length) return "";
  const W = 320, H = 70, pad = 6;
  const tMax = Math.max(...trace.map(p => p.t), 0.001);
  const values = trace.flatMap(p => [p.objective, p.bound]);
  const lo = Math.min(...values), hi = Math.max(...values, lo + 1);
  const x = t => pad + t / tMax * (W - 2 * pad), y = v => H - pad - (v - lo) / (hi - lo) * (H - 2 * pad);
  const line = key => trace.map(p => `${x(p.t)},${y(p[key])}`).join(" ");
  const dots = (key, color) => trace.map(p => `<circle cx="${x(p.t)}" cy="${y(p[key])}" r="2.5" fill="${color}"/>`).join("");
  return `<svg width="${W}" height="${H}" role="img" aria-label="amaç ve sınır">
    <polyline points="${line("bound")}" fill="none" stroke="#6b7785" stroke-dasharray="4 3"/>${dots("bound", "#6b7785")}
    <polyline points="${line("objective")}" fill="none" stroke="#d9480f" stroke-width="2"/>${dots("objective", "#d9480f")}
  </svg><div class="muted" style="font-size:12px">— amaç (bulunan çözümler) &nbsp; ┄ en iyi sınır &nbsp; · ${trace.length} çözüm</div>`;
}

function drawJob(job) {
  const num = v => v == null ? "–" : (Math.round(v * 1000) / 1000);
  const changes = (job.changes || []).map(c =>
    `<div class="change"><b>${esc(c.pairing)}</b>: ${esc(c.from)} → ${esc(c.to)}<br><span class="muted">${esc(c.reason)}</span></div>`).join("");
  $("job").className = "";
  $("job").innerHTML = `
    <p><span class="badge ${job.status}">${job.status}</span> <span class="mono">${esc(job.trigger)}</span></p>
    <table>
      <tr><td>çözücü durumu</td><td><b>${job.solver_status || "–"}</b></td></tr>
      <tr><td>amaç / en iyi sınır</td><td>${num(job.objective)} / ${num(job.best_bound)}</td></tr>
      <tr><td>gap</td><td>${job.gap == null ? "–" : (job.gap * 100).toFixed(1) + " %"}</td></tr>
      <tr><td>çözüm süresi</td><td>${num(job.solve_seconds)} sn</td></tr>
      <tr><td>deneme</td><td>${job.attempts}</td></tr>
      <tr><td>girdi anlık görüntüsü</td><td><a href="/jobs/${job.id}/input" target="_blank">JSON</a></td></tr>
    </table>
    ${job.error ? `<div class="change" style="border-color:var(--bad);background:#fff0f0">${esc(job.error)}</div>` : ""}
    ${changes || (job.status === "succeeded" ? `<p class="muted">Değişiklik yok: mevcut plan kurallara uyuyor.</p>` : "")}
    ${traceChart(job.trace)}`;
}

async function refresh() {
  try {
    const [schedule, jobs, health] = await Promise.all(
      ["/schedule", "/jobs", "/health"].map(u => fetch(u).then(r => r.json())));
    drawGantt(schedule);
    $("health").textContent = `db ${health.db} · mq ${health.rabbitmq} · ${health.git_sha}`;
    if (jobs.length) drawJob(jobs[0]);
    else { $("job").className = "muted"; $("job").textContent = "Henüz iş yok. Sağdan bir mesaj gönderin."; }
    $("history").innerHTML = jobs.map(j =>
      `<div><span class="badge ${j.status}">${j.status}</span> <span class="mono">${esc(j.trigger)}</span></div>`).join("") || "–";
  } catch (e) { $("health").textContent = "API'ye ulaşılamıyor"; }
}

drawAxis();
refresh();
setInterval(refresh, 2000);                              // iş durumu birkaç saniyede bir yenilenir
</script>
</body>
</html>
